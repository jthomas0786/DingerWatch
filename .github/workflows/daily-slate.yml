# .github/workflows/daily-slate.yml
#
# Rebuilds slate.json every morning and commits it. GitHub Pages then serves it
# same-origin alongside your HTML, so the browser never makes a cross-origin
# request — which is what was getting blocked when publishing before.

name: Build daily MLB slate

on:
  schedule:
    # 10:00 UTC = 6am ET / 3am PT — after overnight games finish, before first pitch.
    # Note: GitHub cron is UTC and does NOT shift with daylight saving.
    - cron: '0 10 * * *'
  workflow_dispatch:      # lets you trigger a rebuild by hand from the Actions tab
    inputs:
      date:
        description: 'Date to build (YYYY-MM-DD), blank = today'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Guard against the example fixture being served as real data
        run: |
          if [ -f slate.json ] && grep -q '"name": *"Player 6' slate.json; then
            echo "::error::slate.json contains mock fixture data — delete it and let the build regenerate."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install needed — the builder uses only Node's built-in fetch.

      - name: Build today's slate
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node build-slate.js --date "${{ inputs.date }}" --out slate.json --verbose
          else
            node build-slate.js --out slate.json --verbose
          fi

      # Real odds + one-tap betslip deep links. Allowed to fail: without it the
      # app still works, it just falls back to the text handoff instead of
      # opening a loaded betslip.
      - name: Attach odds and betslip links
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY not set — skipping odds (betslips will fall back to text)"
          else
            node fetch-odds.js --slate slate.json
          fi

      # Real odds + one-tap betslip deep links. Allowed to fail: without it the
      # app still works, it just falls back to the text handoff instead of
      # opening a loaded betslip.
      - name: Attach odds and betslip links
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY not set — skipping odds (betslips will fall back to text)"
          else
            node fetch-odds.js --slate public/slate.json
          fi

      # Optional: layer Statcast metrics on top. Allowed to fail without killing
      # the build, since it scrapes Baseball Savant and can break when they change
      # their page structure. A slate without Statcast is still fully usable.
      - name: Enrich with Statcast (optional)
        continue-on-error: true
        run: |
          pip install --quiet pybaseball pandas
          python enrich-statcast.py --slate slate.json

      - name: Sanity check output
        run: |
          # NB: package.json sets "type": "module", so require() is unavailable here.
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const raw = readFileSync('.slate.json','utf8');
            let s;
            try {
              s = JSON.parse(raw);
            } catch (err) {
              // Point at the offending text instead of just echoing a parse error.
              // Bare NaN/Infinity from pandas is the usual culprit.
              const m = raw.match(/:\s*(NaN|Infinity|-Infinity)/);
              if (m) {
                const at = raw.indexOf(m[0]);
                console.error(`::error::slate.json contains bare ${m[1]}, which is not valid JSON.`);
                console.error('Context: ' + raw.slice(Math.max(0,at-120), at+120).replace(/\n/g,' '));
                console.error('Fix: enrich-statcast.py must sanitise pandas NaN before writing.');
              } else {
                console.error('::error::slate.json is not valid JSON: ' + err.message);
                console.error('Context: ' + raw.slice(0, 300));
              }
              process.exit(1);
            }
            if (!Array.isArray(s.games)) { console.error('malformed slate'); process.exit(1); }
            console.log(\`✓ \${s.games.length} games for \${s.date}, generated \${s.generatedAt}\`);
            const byStatus = s.games.reduce((a,g)=>((a[g.status]=(a[g.status]||0)+1),a),{});
            console.log('  status:', JSON.stringify(byStatus));
            if (s.games.length && s.games.every(g=>g.status==='Final'))
              console.warn('  ⚠ every game is Final — likely built for the wrong date');
            if (s.games.length < 4)
              console.warn(\`  ⚠ only \${s.games.length} games — a normal MLB day has 8-15\`);
            (s.warnings||[]).forEach(w => console.log('  warn: ' + w));
          "

      - name: Commit if changed
        run: |
          git config user.name  'slate-bot'
          git config user.email 'actions@github.com'

          # Commit only the files this job owns, so a concurrent push of
          # index.html or config isn't clobbered.
<<<<<<< HEAD
          git add slate.json
=======
          git add slate.json
>>>>>>> ad53607 (moved everything from /public/ to the public root)
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "slate: $(date -u +%Y-%m-%d)"

          # The checkout can go stale while the build runs — any push made in
          # the meantime makes this a non-fast-forward and the push is rejected.
          # Rebase onto whatever arrived and retry rather than failing the run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto remote (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
<<<<<<< HEAD
              echo "::error::rebase failed — resolve the conflict in public/slate.json manually"
=======
              echo "::error::rebase failed — resolve the conflict in slate.json manually"
>>>>>>> ad53607 (moved everything from /public/ to the public root)
              exit 1
            }
            sleep $((attempt * 3))
          done

          echo "::error::could not push after 5 attempts"
          exit 1

  # Optional second job: keep live scores fresh during game hours without a server.
  # Comment this in if you want the Slate tab to update even for users who leave
  # the page open — otherwise client-side polling handles it fine.
